name: Update song catalog

on:
  push:
    paths:
      - 'demo-songs/**'
      - 'community-songs/**'
      - 'scripts/build-song-catalog.py'
      - '.github/workflows/song-catalog.yml'
  workflow_dispatch:

# Keep Settings > Pages on: Deploy from a branch > main > /(root).
# This workflow regenerates app-files/song-catalog.js from demo-songs/ and community-songs/ and
# asks Pages to rebuild, because commits made with GITHUB_TOKEN do not trigger it.
permissions:
  contents: write
  pages: write

concurrency:
  group: song-catalog
  cancel-in-progress: true

jobs:
  update-catalog:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build demo and community song catalog
        run: python scripts/build-song-catalog.py

      - name: Commit generated catalog
        id: catalog_commit
        shell: bash
        run: |
          if git diff --quiet -- app-files/song-catalog.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Catalog is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-files/song-catalog.js
          git commit -m "Update song catalog"
          git push origin HEAD:${{ github.event.repository.default_branch }}
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Request GitHub Pages rebuild
        if: steps.catalog_commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
